<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Wortsuchspiel: Jedes Emoji steht fuer den ersten Buchstaben seines Namens.">
<meta name="color-scheme" content="dark">
<title>BEUTEZUG &ndash; die Emoji-Wortjagd</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#127829;</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="scanlines" aria-hidden="true"></div>

<main id="automat">

  <section id="brettRahmen" class="marquee">
    <!-- Die Zugspur gehoert in das Gitter, nicht daneben: sie wird aus
         den Kachelkoordinaten gezeichnet, und die zaehlen ab #brett. -->
    <div id="brett" role="grid" aria-label="Spielbrett">
      <svg id="spur" aria-hidden="true" focusable="false">
        <rect id="spurKapsel" />
      </svg>
    </div>
  </section>

  <aside id="panel">

    <div class="tafel marquee" id="titelTafel">
      <div id="titel"></div>
    </div>

    <div class="block">
      <div class="etikett" id="lblAuszahlung"></div>
      <div class="zaehlerreihe">
        <div class="zaehler marquee" id="auszahlung"></div>
        <div class="chip" id="abzug" hidden></div>
      </div>
    </div>

    <div class="tafel marquee wachsend">
      <div class="etikett" id="lblPlan"></div>
      <div id="plan"></div>
      <div id="extra" class="extrazeile"></div>
    </div>

    <div class="knopfreihe">
      <button type="button" id="btnTipp" class="knopf gold marquee">
        <span id="tippText"></span>
      </button>
      <button type="button" id="btnMenu" class="knopf violett">
        <span id="menuText"></span>
      </button>
    </div>

    <div class="fussreihe">
      <span id="rest"></span>
      <button type="button" id="btnSpicken" class="nurtext">
        <span id="spickenText"></span>
      </button>
    </div>

  </aside>

</main>

<div id="overlay" role="dialog" aria-modal="true">
  <div id="overlayInhalt"></div>
</div>

<script src="js/pixelfont.js"></script>
<script src="js/emoji.js"></script>
<script src="js/words.js"></script>
<script src="js/board.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
</body>
</html>
