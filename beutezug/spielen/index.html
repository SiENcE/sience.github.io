<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Wortsuchspiel: Jedes Emoji steht fuer den ersten Buchstaben seines Namens.">
<meta name="color-scheme" content="dark">
<title>BEUTEZUG &ndash; die Emoji-Wortjagd</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#127829;</text></svg>">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/lexend.css">
</head>
<body>
<div class="scanlines" aria-hidden="true"></div>
<main id="automat">
<header id="kopf">
<div class="tafel" id="titelTafel">
<div id="marke"></div>
<div id="titel"></div>
<div id="alarm" role="timer" hidden></div>
</div>
<div class="block" id="beuteAnzeige">
<div class="etikett" id="lblAuszahlung"></div>
<div class="zaehlerreihe">
<div class="zaehler" id="auszahlung"></div>
<div class="chip" id="einsatz" hidden></div>
</div>
</div>
</header>
<section id="gewinnplan" class="tafel" aria-label="Gewinnplan">
<div class="planKopf">
<div class="etikett" id="lblPlan"></div>
<div class="planRechts">
<span id="versuche" role="img"></span>
<span id="rest"></span>
</div>
</div>
<div id="plan"></div>
<div class="extrazeile">
<span id="extra"></span>
<span id="serie"></span>
</div>
</section>
<section id="brettRahmen">
<div id="brett" role="grid" aria-label="Spielbrett">
<svg id="spur" aria-hidden="true" focusable="false">
<rect id="spurSchein" />
<rect id="spurKapsel" />
</svg>
</div>
<div id="neuigkeit" role="status" aria-live="polite" hidden></div>
</section>
<nav id="aktionen" aria-label="Spielaktionen">
<button type="button" id="btnTipp" class="knopf gold">
<span id="tippText"></span>
</button>
<button type="button" id="btnSpicken" class="knopf violett">
<span id="spickenText"></span>
</button>
<button type="button" id="btnMenu" class="knopf violett">
<span id="menuText"></span>
</button>
</nav>
</main>
<div id="overlay" role="dialog" aria-modal="true" tabindex="-1">
<div id="overlayInhalt"></div>
</div>
<script src="js/i18n.js"></script>
<script src="js/pixelfont.js"></script>
<script src="js/emoji.js"></script>
<script src="js/lauf.js"></script>
<script src="js/words.js"></script>
<script src="js/board.js"></script>
<script src="js/kasse.js"></script>
<script src="js/audio.js"></script>
<script>window.BEUTEZUG_DEMO = {"gruppe":"https://groups.google.com/g/beutezug-tester","test":"https://play.google.com/apps/testing/de.twobitskid.beutezug"};</script>
<script src="js/geraet.js"></script>
<script src="js/game.js"></script>
</body>
</html>
